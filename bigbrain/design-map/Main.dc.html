<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0}
    a{color:#3b82f6;text-decoration:none}
    a:hover{color:#3b82f6}
    @keyframes riseInspo{from{opacity:0;transform:translateY(16px) rotateY(-2deg) rotateX(1deg)}to{opacity:1;transform:translateY(0) rotateY(-2deg) rotateX(1deg)}}
    @keyframes riseCulture{from{opacity:0;transform:translateY(16px) rotateY(2deg) rotateX(-1deg)}to{opacity:1;transform:translateY(0) rotateY(2deg) rotateX(-1deg)}}
    @keyframes riseKnowledge{from{opacity:0;transform:translateY(16px) rotateY(-1.5deg) rotateX(-1deg)}to{opacity:1;transform:translateY(0) rotateY(-1.5deg) rotateX(-1deg)}}
    .card-inspo{animation:riseInspo .55s cubic-bezier(.22,1,.36,1) both}
    .card-culture{animation:riseCulture .55s cubic-bezier(.22,1,.36,1) .1s both}
    .card-knowledge{animation:riseKnowledge .55s cubic-bezier(.22,1,.36,1) .2s both}
  </style>
</helmet>

<div style="position:relative;width:390px;min-height:940px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e7ecf5;background:#0f1115">

  <div style="position:absolute;left:-40px;right:-40px;top:-40px;height:420px;pointer-events:none;background:radial-gradient(ellipse 380px 220px at 30% 0%, rgba(201,167,255,.10), transparent 60%), radial-gradient(ellipse 320px 200px at 78% 10%, rgba(255,201,120,.09), transparent 60%), radial-gradient(ellipse 300px 200px at 55% 25%, rgba(127,224,176,.08), transparent 60%)"></div>

  <div style="position:relative;display:flex;align-items:center;gap:8px;padding:20px 10px 6px;border-bottom:1px solid #283042">
    <div style="flex:none;width:44px;height:44px;border:1px solid #283042;background:#161a22;color:#e7ecf5;border-radius:14px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:.35">&#8249;</div>
    <div style="flex:1;min-width:0;font-size:13px;font-weight:700;color:#e7ecf5">Map</div>
    <div style="flex:none;width:44px;height:44px;border:1px solid #283042;background:#161a22;color:#9aa6bd;border-radius:14px;font-size:15px;display:flex;align-items:center;justify-content:center">&#8635;</div>
  </div>

  <div style="position:relative;padding:22px 18px 30px">
    <h1 style="margin:0 0 6px;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.08">Your archive</h1>
    <div style="font-size:13px;color:#9aa6bd;letter-spacing:.01em">1,575 refs &middot; 3 regions</div>

    <div style="margin-top:30px;perspective:1200px">

      <div class="card-inspo" style="position:relative;border:1px solid #382a52;background:linear-gradient(155deg,#1c1830,#161a22 62%);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(201,167,255,.35)">
        <div style="position:absolute;inset:0;background:radial-gradient(ellipse 260px 160px at 85% -10%, rgba(201,167,255,.22), transparent 65%)"></div>
        <div style="position:relative;display:flex;gap:10px;padding:16px 16px 0">
          <div style="flex:1.4;aspect-ratio:1/1;border-radius:12px;background:linear-gradient(135deg,#2a2340,#181425);display:flex;align-items:center;justify-content:center;border:1px solid #392f52">
            <svg width="24" height="24" viewBox="0 0 20 20" style="color:#c9a7ff"><rect x="3" y="4" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"></rect><circle cx="7.3" cy="8.3" r="1.3" fill="currentColor"></circle><path d="M4 14.5l4.2-4.3 2.6 2.6 2.4-3 3.8 4.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"></path></svg>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;gap:10px">
            <div style="flex:1;border-radius:12px;background:linear-gradient(135deg,#241f38,#171320);border:1px solid #392f52;display:flex;align-items:center;justify-content:center">
              <svg width="19" height="19" viewBox="0 0 20 20" style="color:#c9a7ff"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.4"></circle><path d="M8.2 6.8l5.4 3.2-5.4 3.2z" fill="currentColor"></path></svg>
            </div>
            <div style="flex:1;border-radius:12px;background:linear-gradient(135deg,#231d36,#16121d);border:1px solid #392f52;display:flex;align-items:center;justify-content:center">
              <svg width="19" height="19" viewBox="0 0 20 20" style="color:#c9a7ff"><path d="M3.5 5.5h13a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H9l-3.2 2.6V13.5h-2.3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg>
            </div>
          </div>
        </div>
        <div style="position:relative;padding:14px 16px 18px">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
            <div style="font-size:20px;font-weight:800;letter-spacing:-.01em;color:#e7ecf5">INSPO</div>
            <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#c9a7ff">everything else</div>
          </div>
          <div style="margin-top:4px;font-size:13px;color:#9aa6bd">1,187 refs &middot; 24 clusters</div>
        </div>
      </div>

      <div class="card-culture" style="position:relative;margin-top:14px;border:1px solid #4a3820;background:linear-gradient(155deg,#241c14,#161a22 62%);border-radius:20px;overflow:hidden;box-shadow:0 14px 32px -18px rgba(255,201,120,.3)">
        <div style="position:absolute;inset:0;background:radial-gradient(ellipse 220px 140px at 12% -10%, rgba(255,201,120,.2), transparent 65%)"></div>
        <div style="position:relative;display:flex;align-items:center;gap:14px;padding:16px">
          <div style="width:64px;height:64px;flex:none;border-radius:12px;background:linear-gradient(135deg,#3a2c18,#20180d);border:1px solid #4a3820;display:flex;align-items:center;justify-content:center">
            <svg width="21" height="21" viewBox="0 0 20 20" style="color:#ffc978"><path d="M3.5 5.5h13a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H9l-3.2 2.6V13.5h-2.3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:18px;font-weight:800;letter-spacing:-.01em">CULTURE+NEWS</div>
            <div style="margin-top:2px;font-size:12.5px;color:#9aa6bd">236 refs &middot; 11 clusters</div>
          </div>
        </div>
      </div>

      <div class="card-knowledge" style="position:relative;margin-top:14px;border:1px solid #1e4634;background:linear-gradient(155deg,#131f1a,#161a22 62%);border-radius:20px;overflow:hidden;box-shadow:0 14px 32px -18px rgba(127,224,176,.28)">
        <div style="position:absolute;inset:0;background:radial-gradient(ellipse 220px 140px at 88% -10%, rgba(127,224,176,.18), transparent 65%)"></div>
        <div style="position:relative;display:flex;align-items:center;gap:14px;padding:16px">
          <div style="width:64px;height:64px;flex:none;border-radius:12px;background:linear-gradient(135deg,#1d3327,#101c16);border:1px solid #1e4634;display:flex;align-items:center;justify-content:center">
            <svg width="21" height="21" viewBox="0 0 20 20" style="color:#7fe0b0"><path d="M4 15V6.2c0-.5.34-.9.83-1.02L10 4l5.17 1.18c.5.12.83.53.83 1.02V15l-6-2-6 2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:18px;font-weight:800;letter-spacing:-.01em">KNOWLEDGE</div>
            <div style="margin-top:2px;font-size:12.5px;color:#9aa6bd">152 refs &middot; 7 clusters</div>
          </div>
        </div>
      </div>

    </div>

    <div style="display:flex;gap:8px;justify-content:center;margin-top:34px;flex-wrap:wrap">
      <div style="min-height:44px;display:flex;align-items:center;padding:0 16px;border:1px solid #283042;background:#161a22;border-radius:14px;color:#9aa6bd;font-size:13px;font-weight:600">Gallery</div>
      <div style="min-height:44px;display:flex;align-items:center;padding:0 16px;border:1px solid #283042;background:#161a22;border-radius:14px;color:#9aa6bd;font-size:13px;font-weight:600">Queue</div>
      <div style="min-height:44px;display:flex;align-items:center;padding:0 16px;border:1px solid #283042;background:#161a22;border-radius:14px;color:#9aa6bd;font-size:13px;font-weight:600">Brief</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
