# Deploys to save-ref-v2.<your-subdomain>.workers.dev — a NEW worker, so it
# runs side-by-side and never touches your existing save-ref-worker or its data.
# When you're happy and want it to BE the main one, change this back to
# "save-ref-worker" and redeploy (that replaces the old code; migrate old data
# first via POST /api/import if you can export it).
name = "save-ref-v2"
main = "src/index.js"
compatibility_date = "2025-05-01"

# KV holds the refs (and uploaded blobs unless you add R2 below).
# Create it once, then paste the printed id:
#   npx wrangler kv namespace create save-ref-kv
[[kv_namespaces]]
binding = "REFS_KV"
id = "REPLACE_WITH_KV_ID"

# OPTIONAL — offload uploaded image/file bytes to R2 instead of KV (recommended
# if you drop lots of large files; KV values are capped at 25 MB). Create with:
#   npx wrangler r2 bucket create save-ref-blobs
# then uncomment:
# [[r2_buckets]]
# binding = "REFS_R2"
# bucket_name = "save-ref-blobs"

# Minute cron: fires due reminders (push / WhatsApp / SMS) and purges trash
# older than 30 days. Free plan allows this.
[triggers]
crons = ["* * * * *"]

# AUTH_TOKEN is a secret, never committed. Set it with:
#   openssl rand -hex 32           # copy the output -> this is your Big Brain token
#   npx wrangler secret put AUTH_TOKEN
# Paste the SAME value into the /drop page's first-time setup field.
#
# OPTIONAL — reminder delivery over WhatsApp / SMS via Twilio. Each channel
# only appears in the "Remind me" sheet once its secrets exist:
#   npx wrangler secret put TWILIO_ACCOUNT_SID
#   npx wrangler secret put TWILIO_AUTH_TOKEN
#   npx wrangler secret put REMINDER_PHONE        # your phone, e.g. +17785550000
#   npx wrangler secret put TWILIO_FROM           # Twilio number -> enables SMS
#   npx wrangler secret put TWILIO_WHATSAPP_FROM  # Twilio WhatsApp sender -> enables WhatsApp
# (Big Brain push notifications need no secrets — the VAPID keypair is
# auto-generated into KV on first use.)
